services:
  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - hotel-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8761/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8090:8090"
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - hotel-network

  # === BASE DE DATOS ===
  mysql-auth:
    image: mysql:8.0
    container_name: mysql-auth
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_auth
    ports:
      - "3313:3306"
    networks:
      - hotel-network

  mysql-clientes:
    image: mysql:8.0
    container_name: mysql-clientes
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_clientes
    ports:
      - "3310:3306"
    networks:
      - hotel-network

  mysql-reservas:
    image: mysql:8.0
    container_name: mysql-reservas
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_reservas
    ports:
      - "3311:3306"
    networks:
      - hotel-network

  mysql-pagos:
    image: mysql:8.0
    container_name: mysql-pagos
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_pagos
    ports:
      - "3312:3306"
    networks:
      - hotel-network

  mysql-hoteles:
    image: mysql:8.0
    container_name: mysql-hoteles
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_hoteles
    ports:
      - "3307:3306"
    networks:
      - hotel-network

  mysql-habitaciones:
    image: mysql:8.0
    container_name: mysql-habitaciones
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_habitaciones
    ports:
      - "3308:3306"
    networks:
      - hotel-network

  mariadb-servicios:
    image: mariadb:10.11
    container_name: mariadb-servicios
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_servicios
    ports:
      - "3309:3306"
    networks:
      - hotel-network

  # === TUS MICROSERVICIOS ===
  ms-auth:
    build: ./ms-auth
    container_name: ms-auth
    ports:
      - "8081:8081"
    depends_on:
      - mysql-auth
      - eureka-server
    networks:
      - hotel-network

  ms-clientes:
    build: ./ms-clientes
    container_name: ms-clientes
    ports:
      - "8084:8084"
    depends_on:
      - mysql-clientes
      - eureka-server
    networks:
      - hotel-network

  ms-reservas:
    build: ./ms-reservas/ms-reserva
    container_name: ms-reservas
    ports:
      - "8082:8082"
    depends_on:
      - mysql-reservas
      - eureka-server
    networks:
      - hotel-network

  ms-pagos:
    build: ./ms-pagos/ms-pagos
    container_name: ms-pagos
    ports:
      - "8083:8083"
    depends_on:
      - mysql-pagos
      - eureka-server
    networks:
      - hotel-network

  # === MICROSERVICIOS DE BELEN ===
  ms-hoteles:
    build: ./ms-hoteles
    container_name: ms-hoteles
    ports:
      - "8085:8085"
    depends_on:
      - mysql-hoteles
      - eureka-server
    networks:
      - hotel-network

  ms-habitaciones:
    build: ./ms-habitaciones
    container_name: ms-habitaciones
    ports:
      - "8086:8086"
    depends_on:
      - mysql-habitaciones
      - eureka-server
    networks:
      - hotel-network

  ms-servicios:
    build: ./ms-servicios
    container_name: ms-servicios
    ports:
      - "8087:8087"
    depends_on:
      - mariadb-servicios
      - eureka-server
    networks:
      - hotel-network

networks:
  hotel-network:
    driver: bridge
