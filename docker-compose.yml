version: '3.8'
services:
  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - hotel-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8761/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "9000:8080"
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - hotel-network

  ms-housekeeping:
    build: ./ms-housekeeping
    container_name: ms-housekeeping
    depends_on:
      eureka-server:
        condition: service_healthy
      mysql-housekeeping:
        condition: service_healthy
    networks:
      - hotel-network
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-housekeeping:3306/db_housekeeping
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

  ms-reportes:
    build: ./ms-reportes
    container_name: ms-reportes
    depends_on:
      eureka-server:
        condition: service_healthy
      mysql-reportes:
        condition: service_healthy
    networks:
      - hotel-network
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-reportes:3306/db_reportes
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

  ms-notificaciones:
    build: ./ms-notificaciones
    container_name: ms-notificaciones
    depends_on:
      eureka-server:
        condition: service_healthy
      mysql-notificaciones:
        condition: service_healthy
    networks:
      - hotel-network
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-notificaciones:3306/db_notificaciones
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

  ms-auth:
    build: ./ms-auth
    container_name: ms-auth
    depends_on:
      eureka-server:
        condition: service_healthy
      mysql-auth:
        condition: service_healthy
    networks:
      - hotel-network
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-auth:3306/db_auth
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
  ms-clientes:
    build: ./ms-clientes
    container_name: ms-clientes
    depends_on:
      eureka-server:
        condition: service_healthy
      mysql-clientes:
        condition: service_healthy
    networks:
      - hotel-network
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-clientes:3306/db_clientes
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
  ms-reservas:
    build: ./ms-reservas
    container_name: ms-reservas
    depends_on:
      eureka-server:
        condition: service_healthy
      mysql-reservas:
        condition: service_healthy
    networks:
      - hotel-network
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-reservas:3306/db_reservas
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
  ms-pagos:
    build: ./ms-pagos
    container_name: ms-pagos
    depends_on:
      eureka-server:
        condition: service_healthy
      mysql-pagos:
        condition: service_healthy
    networks:
      - hotel-network
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-pagos:3306/db_pagos
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

  ms-servicios:
    build: ./ms-servicios
    container_name: ms-servicios
    depends_on:
      eureka-server:
        condition: service_healthy
      mysql-servicios:
        condition: service_healthy
    networks:
      - hotel-network
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-servicios:3306/db_servicios
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update


  mysql-housekeeping:
    image: mysql:8.0
    container_name: mysql-housekeeping
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_housekeeping
    ports:
      - "3314:3306"
    networks:
      - hotel-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s

  mysql-reportes:
