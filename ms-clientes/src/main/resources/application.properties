server.port=8084
spring.application.name=ms-clientes

# LOCAL: usa localhost + puerto mapeado al host
spring.datasource.url=jdbc:mysql://localhost:3306/db_clientes?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.flyway.enabled=false

# LOCAL: Eureka corriendo en tu máquina (si lo levantas aparte) o localhost si Eureka está en docker con puerto expuesto
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html