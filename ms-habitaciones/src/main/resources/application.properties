spring.application.name=ms-habitaciones
server.port=8086

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Configuracion Base de Datos (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/db_habitaciones?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Configuracion de Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html

# Comunicacion con otros microservicios
hotel.service.url=http://localhost:8085
notificacion.service.url=http://localhost:8088