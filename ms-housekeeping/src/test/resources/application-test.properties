# Configuracion para tests: base de datos en memoria, sin depender de Docker/MySQL
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Desactiva Flyway en tests (usamos ddl-auto para crear el esquema directo desde las entidades)
spring.flyway.enabled=false

# Evita que intente registrarse en Eureka durante los tests
eureka.client.enabled=false